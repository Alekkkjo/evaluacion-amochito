<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación amochito :3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff8fc2; --pink-d:#ff5fa8; --pink-l:#ffe6f2; --pink-xl:#fff4fa;
    --lav:#c9b3ff; --lav-d:#9a78ff; --lav-l:#efe7ff;
    --mint:#b8f0d8; --mint-d:#3cc79a; --sun:#fff3b0; --sun-d:#ffd23f;
    --ink:#58385f; --ink-l:#8d6b96; --accent:var(--pink-d); --accent-l:var(--pink-l);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
    background-color:#ffe9f4;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,179,255,.55) 0, transparent 38%),
      radial-gradient(circle at 90% 30%, rgba(255,143,194,.45) 0, transparent 40%),
      radial-gradient(circle at 20% 90%, rgba(184,240,216,.6) 0, transparent 40%),
      radial-gradient(circle at 85% 95%, rgba(255,243,176,.7) 0, transparent 35%),
      radial-gradient(#fff 2.5px, transparent 3px);
    background-size:auto,auto,auto,auto,34px 34px;
    background-attachment:fixed;
    padding:26px 14px 50px;
  }
  /* decoraciones flotantes */
  .deco{position:fixed;pointer-events:none;z-index:0;user-select:none}
  .deco svg{display:block}
  .bob{animation:bob 6s ease-in-out infinite}
  .twinkle{animation:twinkle 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-16px) rotate(6deg)}}
  @keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @keyframes sheen{to{background-position:200% 0}}

  .wrap{max-width:700px;margin:0 auto;position:relative;z-index:2}

  /* ventana retro */
  .win{
    background:#fff;border:4px solid var(--ink);border-radius:26px;overflow:hidden;
    box-shadow:8px 8px 0 var(--lav), 8px 8px 0 4px var(--ink);
    animation:pop .5s both;
  }
  .win-bar{
    display:flex;align-items:center;gap:8px;padding:10px 16px;
    background:linear-gradient(90deg,var(--pink),var(--lav));border-bottom:4px solid var(--ink);
    font-family:'Fredoka';font-weight:600;font-size:14px;color:#fff;letter-spacing:.3px;
  }
  .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
  .dot:nth-child(1){background:#ffd23f}.dot:nth-child(2){background:#b8f0d8}.dot:nth-child(3){background:#fff}
  .win-bar span.t{margin-left:auto;text-shadow:0 2px 0 rgba(88,56,95,.35)}
  .win-body{
    padding:28px 24px 30px;
    background:
      radial-gradient(var(--pink-l) 2px, transparent 2.5px) 0 0/22px 22px, #fff;
  }

  /* inicio */
  .hero{text-align:center}
  h1{
    font-family:'Pacifico',cursive;font-weight:400;line-height:1.15;
    font-size:clamp(36px,10vw,58px);color:#fff;margin:6px 0 4px;
    -webkit-text-stroke:0;
    text-shadow:
      -3px -3px 0 var(--pink-d), 3px -3px 0 var(--pink-d), -3px 3px 0 var(--pink-d), 3px 3px 0 var(--pink-d),
      0 -3px 0 var(--pink-d), 0 3px 0 var(--pink-d), -3px 0 0 var(--pink-d), 3px 0 0 var(--pink-d),
      0 7px 0 var(--lav-d), 0 10px 14px rgba(154,120,255,.4);
    transform:rotate(-2deg);
  }
  .ribbon{
    display:inline-block;margin-top:14px;font-family:'Fredoka';font-weight:600;font-size:16px;color:var(--ink);
    background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:6px 20px;
    box-shadow:3px 3px 0 var(--ink);transform:rotate(1.5deg)
  }
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:24px 0 8px}
  .chip{
    font-family:'Fredoka';font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;
    border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--ink);
    animation:pop .5s both;
  }
  .hint{margin-top:18px;font-weight:700;color:var(--ink-l);font-size:15px}

  /* mascota */
  .mascot{width:132px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 8px 0 rgba(154,120,255,.25))}
  .mascot.small{width:84px;margin:0}
  .mascot .mouth-happy,.mascot .mouth-sad,.mascot .eyes-happy,.mascot .tear{display:none}
  .mascot.happy .mouth-idle,.mascot.happy .eyes-idle{display:none}
  .mascot.happy .mouth-happy,.mascot.happy .eyes-happy{display:block}
  .mascot.sad .mouth-idle{display:none}.mascot.sad .mouth-sad,.mascot.sad .tear{display:block}
  .mascot.happy{animation:wiggle .5s}
  .mascot.sad{animation:shake .4s}
  .mascot .blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

  /* botones */
  .btn{
    font-family:'Fredoka';font-weight:600;font-size:19px;color:#fff;cursor:pointer;display:block;margin:24px auto 0;
    background:linear-gradient(180deg,#ff8cc4,var(--pink-d));border:4px solid var(--ink);border-radius:999px;
    padding:13px 36px;box-shadow:0 6px 0 var(--ink);position:relative;overflow:hidden;
    text-shadow:0 2px 0 rgba(88,56,95,.4);transition:transform .1s, box-shadow .1s;
  }
  .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:-100% 0}
  .btn:hover::after{animation:sheen .8s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  .btn.lav{background:linear-gradient(180deg,#b79cff,var(--lav-d))}
  .btn:focus-visible,.opt:focus-visible{outline:4px dashed var(--lav-d);outline-offset:4px}
  .hidden{display:none!important}

  /* quiz */
  .progress{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .pip{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;transition:.3s;position:relative}
  .pip.now{background:var(--sun);transform:scale(1.25);box-shadow:0 0 0 3px var(--sun-d)}
  .pip.ok{background:var(--mint-d)}.pip.no{background:#ff93a8}
  .host{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
  .bubble{
    position:relative;flex:1;background:var(--accent-l);border:3px solid var(--ink);border-radius:20px;
    padding:10px 14px;font-family:'Fredoka';font-weight:500;font-size:15px;box-shadow:3px 3px 0 var(--ink);
  }
  .bubble::before{content:"";position:absolute;left:-13px;bottom:16px;width:18px;height:18px;background:var(--accent-l);
    border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
  .tag{
    display:inline-flex;gap:6px;align-items:center;font-family:'Fredoka';font-weight:600;font-size:14px;
    background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;
    box-shadow:2px 2px 0 var(--ink);text-shadow:0 1px 0 rgba(0,0,0,.25);margin-bottom:12px
  }
  .qbox{
    background:var(--pink-xl);border:3px dashed var(--accent);border-radius:20px;padding:16px 18px;margin-bottom:16px;
    font-family:'Fredoka';font-weight:500;font-size:clamp(19px,4.8vw,24px);line-height:1.35;
  }
  .opts{display:grid;gap:11px}
  .opt{
    text-align:left;font-family:'Nunito';font-weight:800;font-size:16px;color:var(--ink);cursor:pointer;
    background:#fff;border:3px solid var(--ink);border-radius:18px;padding:11px 14px;
    display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s, background .15s;animation:pop .4s both;
  }
  .opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 0 var(--ink);background:var(--accent-l)}
  .opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);
    display:grid;place-items:center;font-family:'Fredoka';font-weight:700;color:#fff;font-size:16px}
  .opt.ok{background:var(--mint);animation:wiggle .5s}
  .opt.ok .l{background:var(--mint-d)}
  .opt.no{background:#ffdbe3;animation:shake .4s}
  .opt.no .l{background:#ff7f9a}
  .opt:disabled{cursor:default}
  .opt:disabled:not(.ok):not(.no){opacity:.55}
  .fb{margin-top:18px;background:var(--sun);border:3px solid var(--ink);border-radius:20px;padding:14px 16px;
      box-shadow:4px 4px 0 var(--ink);font-weight:700;line-height:1.5;animation:pop .35s both}
  .fb b{font-family:'Fredoka';font-size:19px;display:block;margin-bottom:2px}

  /* resultado */
  .res{text-align:center}
  .badge{
    width:170px;height:170px;border-radius:50%;margin:10px auto 6px;display:grid;place-items:center;
    background:conic-gradient(var(--pink) 0 25%,var(--sun) 0 50%,var(--mint) 0 75%,var(--lav) 0);
    border:5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);position:relative;animation:pop .6s both;
  }
  .badge i{position:absolute;inset:14px;background:#fff;border:4px solid var(--ink);border-radius:50%}
  .badge span{position:relative;font-family:'Fredoka';font-weight:700;font-size:48px;color:var(--pink-d);text-shadow:0 3px 0 var(--lav)}
  .stars{font-size:38px;letter-spacing:6px;margin:8px 0}
  .msg{font-family:'Pacifico';font-size:clamp(22px,6vw,30px);color:var(--lav-d);margin:6px 0 4px}
  .break{display:grid;gap:10px;margin:22px 0 4px;text-align:left}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:'Fredoka';font-weight:500;font-size:14px}
  .meter{height:18px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
  .meter b{display:block;height:100%;background:var(--c);border-right:3px solid var(--ink);transition:width .8s .2s}
  .row em{font-style:normal;font-weight:700}

  /* confeti */
  .conf{position:fixed;z-index:50;pointer-events:none;font-size:24px;animation:fall 1.6s ease-out forwards}
  @keyframes fall{
    0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}
    100%{transform:translate(var(--x),var(--y)) scale(1.1) rotate(var(--r));opacity:0}
  }
  footer{text-align:center;margin-top:26px;font-family:'Fredoka';font-weight:600;color:var(--ink);opacity:.8}
  @media (max-width:480px){.win-body{padding:22px 16px 26px}.mascot.small{width:68px}.deco.hide-m{display:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- decoraciones -->
<div class="deco bob" style="left:3%;top:9%">
  <svg width="90" height="56" viewBox="0 0 90 56"><path d="M20 50a16 16 0 0 1 2-32 22 22 0 0 1 42-4 18 18 0 0 1 8 36z" fill="#fff" stroke="#c9b3ff" stroke-width="4"/><circle cx="36" cy="36" r="2.5" fill="#58385f"/><circle cx="54" cy="36" r="2.5" fill="#58385f"/><path d="M42 40q3 3 6 0" stroke="#58385f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>

<div class="deco twinkle" style="right:6%;bottom:12%;animation-delay:.4s"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#c9b3ff" stroke="#58385f" stroke-width="1.5" stroke-linejoin="round"/></svg></div>

<template id="mascot-tpl">
  <svg viewBox="0 0 140 130" aria-hidden="true">
    <ellipse cx="70" cy="122" rx="40" ry="6" fill="#e5d6ff"/>

    <path d="M38 52C24 22 28 6 42 6c10 0 18 20 20 42z" fill="#ffd0e6" stroke="#58385f" stroke-width="4" stroke-linejoin="round"/>

<div class="wrap">
  <div class="win">
    <div class="win-bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="t">evaluacion_amochito.exe ♡</span></div>

    <div class="win-body">
      <!-- INICIO -->
      <section id="start" class="hero">
        <div class="mascot-slot" data-size="big"></div>
        <h1>Evaluación<br>amochito :3</h1>
        <div class="ribbon">✿ Teorías del aprendizaje · 14 preguntitas ✿</div>
        <div class="chips" id="chips"></div>
        <p class="hint">Elige la respuesta correcta y te voy diciendo cómo vas 💕<br>¡Sin presión, tú puedes!</p>
        <button class="btn" id="go">¡Empezar! ✨</button>
      </section>

      <!-- QUIZ -->
      <section id="quiz" class="hidden">
        <div class="progress" id="pips"></div>
        <div class="host">
          <div class="mascot-slot" data-size="small" id="hostMascot"></div>
          <div class="bubble" id="bubble"></div>
        </div>
        <span class="tag" id="tag"></span>
        <div class="qbox" id="q"></div>
        <div class="opts" id="opts"></div>
        <div class="fb hidden" id="fb"></div>
        <button class="btn lav hidden" id="next">Siguiente 💫</button>
      </section>

      <!-- RESULTADO -->
      <section id="end" class="res hidden">
        <div class="mascot-slot" data-size="big" id="endMascot"></div>
        <div class="badge"><i></i><span id="score"></span></div>
        <div class="stars" id="stars"></div>
        <div class="msg" id="msg"></div>
        <div class="break" id="break"></div>
        <button class="btn" id="again">Intentar otra vez 🌈</button>

<script>
const TOPICS={
  "Behaviorism":{c:"#ff6fae",l:"#ffe0ef",e:"🔔"},
  "Cognitivism":{c:"#9a78ff",l:"#ece4ff",e:"🧠"},
  "Constructivism":{c:"#34c796",l:"#d9f7ea",e:"🧱"},
  "Socioconstructivism":{c:"#ff9a4d",l:"#ffe9d6",e:"🤝"},
  "Social-constructivism":{c:"#4fb7ff",l:"#dff2ff",e:"💬"},
  "Múltiples inteligencias":{c:"#e55cd8",l:"#fbe0f8",e:"🌈"},
  "Learning by doing":{c:"#f2b705",l:"#fff3c4",e:"🛠️"}
};
const Q=[
 {t:"Behaviorism",q:"Para el conductismo (behaviorism), ¿qué se estudia principalmente?",
  o:["Los procesos mentales internos","La conducta observable y medible","Las inteligencias de cada persona","La construcción social del conocimiento"],a:1,
  e:"El conductismo se centra en lo que se puede observar: estímulo → respuesta. La mente se considera una “caja negra”."},
 {t:"Behaviorism",q:"Un profe da un punto extra cada vez que participas, y ahora participas más. ¿Qué concepto conductista es este?",
  o:["Zona de desarrollo próximo","Asimilación","Refuerzo positivo","Inteligencia interpersonal"],a:2,
  e:"El refuerzo positivo (Skinner, condicionamiento operante) aumenta la probabilidad de que una conducta se repita."},
 {t:"Cognitivism",q:"¿Qué postula el cognitivismo (cognitivism) sobre el aprendizaje?",
  o:["Es un cambio de conducta por premios y castigos","Es solo imitar a otros","Es un proceso mental: procesar, almacenar y recuperar información","Depende únicamente del talento innato"],a:2,
  e:"El cognitivismo abre la “caja negra”: atención, memoria, pensamiento y resolución de problemas son clave."},
 {t:"Cognitivism",q:"Una analogía muy usada en el cognitivismo compara la mente con…",
  o:["Un computador que procesa información","Una planta que crece","Un espejo que refleja","Un músculo que se entrena"],a:0,
  e:"El modelo de procesamiento de información: entrada → procesamiento → memoria → salida."},
 {t:"Constructivism",q:"En el constructivismo (constructivism), el estudiante es…",
  o:["Un recipiente vacío que se llena","Un constructor activo de su propio conocimiento","Un receptor de refuerzos","Un observador pasivo"],a:1,
  e:"El aprendiz construye significado a partir de sus experiencias y conocimientos previos."},
 {t:"Constructivism",q:"Según Piaget, cuando un niño ajusta sus esquemas mentales porque la nueva información no encaja, ocurre…",
  o:["Acomodación","Condicionamiento","Memorización","Imitación"],a:0,
  e:"Asimilación = encajar lo nuevo en lo que ya sé. Acomodación = modificar mis esquemas para poder entenderlo."},
 {t:"Socioconstructivism",q:"¿Quién es el principal referente del socioconstructivismo (socioconstructivism)?",
  o:["B. F. Skinner","Howard Gardner","Lev Vygotsky","Ivan Pavlov"],a:2,
  e:"Vygotsky sostiene que el aprendizaje nace de la interacción social y la cultura antes de internalizarse."},
 {t:"Socioconstructivism",q:"La “Zona de Desarrollo Próximo” es la distancia entre…",
  o:["Lo que sabes y lo que olvidaste","Lo que haces solo y lo que lograrías con ayuda de alguien más capaz","Tu casa y la escuela","Tu inteligencia y la de tus compañeros"],a:1,
  e:"Es el espacio donde el apoyo (andamiaje o scaffolding) de un profe o compañero hace posible aprender algo nuevo."},
 {t:"Social-constructivism",q:"Un grupo resuelve un proyecto dialogando, debatiendo y compartiendo ideas. ¿Qué enfoque se refleja?",
  o:["Social-constructivism","Behaviorism","Memorización pasiva","Condicionamiento clásico"],a:0,
  e:"En el social-constructivism el conocimiento se construye colaborando y negociando significados con otras personas."},
 {t:"Social-constructivism",q:"¿Cuál es la diferencia clave entre constructivism y social-constructivism?",
  o:["Ninguna, ambos ignoran al estudiante","El primero enfatiza la construcción individual; el segundo, la interacción social y cultural","El primero usa premios y el segundo castigos","El primero es de Gardner y el segundo de Skinner"],a:1,
  e:"Piaget se enfoca más en lo individual; Vygotsky en lo social. (Socioconstructivism y social-constructivism se usan como sinónimos 💕)"},
 {t:"Múltiples inteligencias",q:"¿Quién propuso la teoría de las inteligencias múltiples?",
  o:["Jean Piaget","John Dewey","Howard Gardner","Albert Bandura"],a:2,
  e:"Howard Gardner (1983) planteó que no existe una única inteligencia, sino varias capacidades relativamente independientes."},
 {t:"Múltiples inteligencias",q:"Una persona que aprende mejor bailando, haciendo deporte o manipulando objetos destaca en la inteligencia…",
  o:["Lógico-matemática","Musical","Corporal-kinestésica","Naturalista"],a:2,
  e:"La inteligencia corporal-kinestésica es la habilidad de usar el cuerpo para resolver problemas o expresar ideas."},
 {t:"Learning by doing",q:"“Learning by doing” se asocia sobre todo con…",
  o:["John Dewey","Ivan Pavlov","Noam Chomsky","Edward Thorndike"],a:0,
  e:"Dewey defendía aprender a través de la experiencia directa y la reflexión sobre ella."},
 {t:"Learning by doing",q:"¿Cuál actividad es el mejor ejemplo de learning by doing?",
  o:["Copiar la definición del cuaderno","Escuchar una clase sin participar","Construir un prototipo, probarlo y mejorarlo","Memorizar una lista de fechas"],a:2,
  e:"Aprendes haciendo: experimentas, te equivocas, reflexionas y vuelves a intentar. ¡Así se queda más!"}
];
const GOOD=["¡Yaaay, correcto! 🎉","¡Eso, genio! ✨","¡Perfecto, amochito! 💖","¡Qué crack! 🌟","¡Bieeen! 🎀"];
const BAD=["Ay, casi 🥺","Uy, esa no era 🌧️","¡No pasa nada! 💭","Tranqui, así se aprende 🫶"];
const START_MSG=["¡Vamos con esta! 💪","Tú puedes, amochito 🌸","Piénsalo con calma ✨","¡Esta te la sabes! 💕"];
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let i=0,score=0,res=[],locked=false;

/* mascotas */
document.querySelectorAll(".mascot-slot").forEach(s=>{
  const n=$("mascot-tpl").content.cloneNode(true);
  n.firstElementChild.classList.add("mascot");
  if(s.dataset.size==="small")n.firstElementChild.classList.add("small");
  s.appendChild(n);
});
const hostSvg=()=>$("hostMascot").firstElementChild;
function mood(el,m){el.classList.remove("happy","sad");void el.getBoundingClientRect();if(m)el.classList.add(m)}

/* chips de inicio */
Object.entries(TOPICS).forEach(([k,v],n)=>{
  const c=document.createElement("span");c.className="chip";
  c.style.background=v.l;c.style.animationDelay=(n*.07)+"s";
  c.textContent=v.e+" "+k;$("chips").appendChild(c);
});
/* pips */
Q.forEach(()=>{const p=document.createElement("i");p.className="pip";$("pips").appendChild(p)});
function pips(){[...$("pips").children].forEach((p,k)=>{
  p.className="pip"+(k===i&&res.length===k?" now":"")+(res[k]===true?" ok":res[k]===false?" no":"");
})}

function show(id){["start","quiz","end"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo({top:0,behavior:"smooth"})}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}

/* confeti */
function confetti(x,y,list,n=14){
  for(let k=0;k<n;k++){
    const s=document.createElement("span");s.className="conf";s.textContent=rnd(list);
    s.style.left=x+"px";s.style.top=y+"px";
    s.style.setProperty("--x",(Math.random()*340-170)+"px");
    s.style.setProperty("--y",(Math.random()*-260-30)+"px");
    s.style.setProperty("--r",(Math.random()*540-270)+"deg");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1700);
  }
}

function render(){
  const q=Q[i],T=TOPICS[q.t];locked=false;
  document.documentElement.style.setProperty("--accent",T.c);
  document.documentElement.style.setProperty("--accent-l",T.l);
  mood(hostSvg(),null);
  $("bubble").textContent=i===0?"¡Empezamos! Tú puedes 💕":rnd(START_MSG);
  $("tag").textContent=T.e+" "+q.t+" · "+(i+1)+"/"+Q.length;
  $("q").textContent=q.q;
  $("fb").classList.add("hidden");$("next").classList.add("hidden");
  const idx=shuffle(q.o.map((_,k)=>k));
  $("opts").innerHTML="";
  idx.forEach((k,n)=>{
    const b=document.createElement("button");b.className="opt";b.style.animationDelay=(n*.07)+"s";
    b.innerHTML='<span class="l">'+"ABCD"[n]+'</span><span></span>';
    b.lastChild.textContent=q.o[k];
    b.dataset.ok=(k===q.a);
    b.onclick=e=>pick(b,k===q.a,e);
    $("opts").appendChild(b);
  });
  pips();
}
function pick(btn,ok,e){
  if(locked)return;locked=true;
  document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.ok==="true")o.classList.add("ok")});
  if(!ok)btn.classList.add("no");
  res.push(ok);if(ok)score++;
  const r=btn.getBoundingClientRect();
  if(ok)confetti(r.left+r.width/2,r.top+r.height/2,["💖","✨","🌸","⭐","🎀","🍓"]);
  mood(hostSvg(),ok?"happy":"sad");
  $("bubble").textContent=ok?rnd(GOOD):rnd(BAD);
  $("fb").innerHTML="<b>"+(ok?"¡Correcto! 🎉":"Casi… 🥺")+"</b>"+Q[i].e;
  $("fb").classList.remove("hidden");
  $("next").textContent=i===Q.length-1?"Ver mi resultado 🌟":"Siguiente 💫";
  $("next").classList.remove("hidden");
  pips();
  setTimeout(()=>$("next").scrollIntoView({behavior:"smooth",block:"center"}),150);
}
function finish(){
  const p=score/Q.length,n=p>=.9?3:p>=.6?2:p>=.3?1:0;
  $("score").textContent=score+"/"+Q.length;
  $("stars").textContent="⭐".repeat(n)+"☆".repeat(3-n);
  $("msg").textContent=p>=.9?"¡Eres un genio, amochito!":p>=.6?"¡Lo hiciste súper bien!":p>=.3?"¡Buen intento, ya casi!":"¡Tú puedes con la próxima!";
  mood($("endMascot").firstElementChild,p>=.5?"happy":"sad");
  const by={};Q.forEach((q,k)=>{by[q.t]=by[q.t]||[0,0];by[q.t][1]++;if(res[k])by[q.t][0]++});
  $("break").innerHTML="";
  Object.entries(by).forEach(([t,[a,b]])=>{
    const T=TOPICS[t],r=document.createElement("div");r.className="row";
    r.innerHTML='<span>'+T.e+' '+t+'</span><div class="meter"><b style="--c:'+T.c+';width:0" data-w="'+(a/b*100)+'%"></b></div><em>'+a+'/'+b+'</em>';
    $("break").appendChild(r);
  });
  show("end");
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".meter b").forEach(m=>m.style.width=m.dataset.w),80));
  if(p>=.5){const w=innerWidth;[.2,.5,.8].forEach((f,k)=>setTimeout(()=>confetti(w*f,innerHeight*.55,["🎉","💖","⭐","🌸","✨","🎀"],18),k*250))}
}
function start(){i=0;score=0;res=[];show("quiz");render()}
$("go").onclick=start;
$("again").onclick=start;
$("next").onclick=()=>{i++;i<Q.length?render():finish();if(i<Q.length)window.scrollTo({top:0,behavior:"smooth"})};
</script>
</body>
</html>
